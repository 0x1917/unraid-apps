# Watch both upstreams this image depends on for NEWER releases, and open a pull
# request when one exists AND a build from it passes the smoke gate.
#
#   * OpenGym's published images (ghcr.io/duartesantos8/opengym-api): the
#     release ARG UPSTREAM_VERSION carries
#   * s6-overlay (pid 1 + supervisor): ARG S6_OVERLAY_VERSION and the four
#     sha256 values for the tarballs the Dockerfile downloads
#
# The build and smoke test run here, before the PR exists. A PR opened with the
# repository's GITHUB_TOKEN does not start other workflow runs (deliberate, to
# stop recursion), so the `on: pull_request` job will not appear on it; the
# evidence is this run's log and the PR body.
name: opengym-scout

on:
  schedule:
    - cron: "23 4 * * *"   # daily; GitHub may delay scheduled runs under load
  workflow_dispatch:
  # A change to the watcher or to this workflow runs before merge, but only the
  # read-only `check` step: a PR has no write token and must never push a branch
  # or open a pull request.
  pull_request:
    paths:
      - images/opengym/scripts/upstream-check.sh
      - .github/workflows/opengym-scout.yml

permissions:
  contents: write        # push the update branch
  pull-requests: write   # open the PR

concurrency:
  group: opengym-scout
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check for newer upstream releases
        id: check
        run: bash images/opengym/scripts/upstream-check.sh check

      - name: Report when there is no newer release
        if: steps.check.outputs.update_available != 'true'
        run: echo "${{ steps.check.outputs.reason }}"

      - name: Pull request run
        if: github.event_name == 'pull_request'
        run: |
          echo "checker-only run: apply, build, smoke and PR creation are skipped"
          echo "this proves the script parses and can query both upstreams"

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.update_available == 'true' && github.event_name != 'pull_request'

      - name: Apply the update
        if: steps.check.outputs.update_available == 'true' && github.event_name != 'pull_request'
        run: |
          bash images/opengym/scripts/upstream-check.sh apply \
            "${{ steps.check.outputs.app_latest }}"           \
            "${{ steps.check.outputs.s6_latest }}"

      - name: Build the updated tree
        if: steps.check.outputs.update_available == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          API="ghcr.io/duartesantos8/opengym-api:${{ steps.check.outputs.app_latest }}"
          DIGEST=$(docker buildx imagetools inspect "$API" --format '{{.Manifest.Digest}}')
          docker build -t opengym:test                          \
            --build-arg VCS_REF="$GITHUB_SHA"                   \
            --build-arg BUILD_DATE="$(git log -1 --format=%cI)" \
            --build-arg BASE_DIGEST="$DIGEST"                   \
            images/opengym

      - name: Smoke test the updated tree
        id: smoke
        if: steps.check.outputs.update_available == 'true' && github.event_name != 'pull_request'
        run: bash images/opengym/scripts/smoke-test.sh opengym:test

      - name: Open the pull request
        if: success() && steps.check.outputs.update_available == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.check.outputs.reason }}
          APP_FROM: ${{ steps.check.outputs.app_current }}
          APP_TO: ${{ steps.check.outputs.app_latest }}
          S6_FROM: ${{ steps.check.outputs.s6_current }}
          S6_TO: ${{ steps.check.outputs.s6_latest }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="ci/upstream-$(date -u +%Y%m%d)-${APP_TO}-s6-${S6_TO}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists — a PR for this update is already open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add images/opengym/Dockerfile images/opengym/NOTICE.md
          git commit -m "Bump ${REASON}"
          git push origin "$BRANCH"

          # Title and body name only what actually changed: an s6-only bump
          # must not claim the app moved, and vice versa.
          PARTS=""
          [ "$APP_FROM" = "$APP_TO" ] || PARTS="OpenGym ${APP_FROM} → ${APP_TO}"
          [ "$S6_FROM" = "$S6_TO" ] || PARTS="${PARTS:+$PARTS and }s6 ${S6_FROM} → ${S6_TO}"
          TITLE="Bump $PARTS"

          CHANGES=""
          if [ "$APP_FROM" != "$APP_TO" ]; then
            CHANGES="\`ARG UPSTREAM_VERSION\` and \`NOTICE.md\` re-vendored from the upstream tag"
          fi
          if [ "$S6_FROM" != "$S6_TO" ]; then
            CHANGES="${CHANGES:+$CHANGES; }the s6-overlay version and its four sha256 pins (fetched from the \`.sha256\` assets of the release)"
          fi

          {
            printf 'Automated upstream release update, built and smoke-tested by [this run](%s/%s/actions/runs/%s).\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            [ "$APP_FROM" = "$APP_TO" ] || printf -- "- OpenGym: \`%s\` → \`%s\`\n" "$APP_FROM" "$APP_TO"
            [ "$S6_FROM" = "$S6_TO" ] || printf -- "- s6-overlay: \`%s\` → \`%s\`\n" "$S6_FROM" "$S6_TO"
            printf -- "- publishes as \`%s\` + \`latest\`\n\n" "$APP_TO"
            printf 'Changes in this branch: %s.\n' "$CHANGES"
            printf "\`LICENSE\` is ours and only fails this job if the upstream licence stops being the AGPL.\n\n"
            printf "**The smoke gate (\`images/opengym/scripts/smoke-test.sh\`) passed on the built image before this PR was opened.** "
            printf "Review the upstream release notes, then merge. The \`opengym-build\`/\`opengym-publish\` chain builds, tests and publishes \`%s\` + \`latest\` from master. " "$APP_TO"
            printf 'Recreate the container on Unraid afterwards to actually run it.\n\n'
            printf 'Closing this PR without merging is a fine answer; the next scheduled run will re-propose it only if the branch is gone.\n'
          } > /tmp/pr-body.md

          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md
