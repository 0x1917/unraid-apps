# Static check that needs no image: workflow schema, via actionlint (which also
# lints the shell inside `run:` blocks).
#
# The image repositories run their own shellcheck gate over the scripts that
# ship inside each container. This repository holds templates only, so there is
# no shell here to lint.

name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned by tag, same version as the local install.
      - name: actionlint
        id: actionlint
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Verdict
        if: always()
        env:
          ACTIONLINT: ${{ steps.actionlint.outcome }}
        run: |
          set -uo pipefail
          echo "actionlint: $ACTIONLINT"
          rc=0
          [ "$ACTIONLINT" = "success" ] || { echo "::error::actionlint failed"; rc=1; }
          exit "$rc"
