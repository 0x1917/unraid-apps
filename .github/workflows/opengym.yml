# Build, smoke-test and publish the opengym image to Docker Hub.
#
# Version comes from `ARG UPSTREAM_VERSION` in the Dockerfile (the upstream
# release the image is built from); the published Hub tag is that version
# prefixed with `v`, exactly as upstream's git releases are named. Publishes
# two tags: the version and `latest`.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   DOCKERHUB_TOKEN     Docker Hub access token (user 0x1917)
# Pull requests build and smoke-test but never push.

name: opengym

on:
  push:
    branches: [master]
    paths:
      - images/opengym/**
      - .github/workflows/opengym.yml
  pull_request:
    paths:
      - images/opengym/**
      - .github/workflows/opengym.yml
  workflow_dispatch:

permissions:
  contents: write   # write = push the opengym-<ver> tag after publishing

# One run at a time per ref: two pushes in quick succession would otherwise
# race the :latest tag and the source-tag step.
concurrency:
  group: opengym-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: 0x1917/opengym

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung buildx step otherwise burns the 6 h default; the whole job
    # (pull + build + smoke + push) runs in ~3 min when healthy.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and upstream ref from the Dockerfile
        id: meta
        run: |
          UP=$(grep -m1 '^ARG UPSTREAM_VERSION=' images/opengym/Dockerfile | cut -d= -f2)
          test -n "$UP"
          # Hub tag keeps the v of the upstream git release; the Dockerfile derives
          # both upstream image refs from the same variable.
          echo "version=v$UP" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/duartesantos8/opengym-api:$UP" >> "$GITHUB_OUTPUT"
          # git-formatted (%cI) so the value is always well-formed — never
          # interpolate commit metadata into `with:` blocks directly.
          echo "build_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Only feeds the provenance label: the Dockerfile itself pins by tag.
      - name: Resolve base image digest
        id: digest
        run: echo "base_digest=$(docker buildx imagetools inspect ${{ steps.meta.outputs.api }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: "0x1917"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: images/opengym
          load: true
          tags: opengym:test
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            BASE_DIGEST=${{ steps.digest.outputs.base_digest }}

      - name: Smoke test
        run: bash images/opengym/smoke-test.sh opengym:test

      # Publish the image the smoke test just ran against: retag, then push.
      # There is no second build, so what ships cannot differ from what was
      # verified (same image ID, same layers).
      - name: Push the tested image (version + latest)
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag opengym:test "$IMAGE:$VERSION"
          docker tag opengym:test "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Verify both tags carry the same digest
        if: github.event_name != 'pull_request'
        run: |
          v=$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} --format '{{.Manifest.Digest}}')
          l=$(docker buildx imagetools inspect ${{ env.IMAGE }}:latest --format '{{.Manifest.Digest}}')
          echo "version: $v"; echo "latest:  $l"
          [ "$v" = "$l" ]

      # Tag the source state that published this version. The tag is created
      # once and never moved: a re-run of the same version leaves the existing
      # tag pointing at the first commit that shipped it.
      - name: Tag the published source state
        if: github.event_name != 'pull_request'
        run: |
          TAG=opengym-${{ steps.meta.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — leaving it untouched"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Source state published as ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          git push origin "refs/tags/$TAG"
