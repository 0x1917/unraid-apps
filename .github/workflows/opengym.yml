# Build, smoke-test and publish the opengym image to Docker Hub.
#
# Version comes from `ARG UPSTREAM_VERSION` in the Dockerfile. The published Hub
# tag is that release, bare (1.4.3) — matching upstream's own image tags; only
# the git tag carries the `v` (opengym-v1.4.3). Publishes two tags: the version
# and `latest`.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   DOCKERHUB_TOKEN     Docker Hub access token (user 0x1917)
# Pull requests build and smoke-test but never push.

name: opengym

on:
  push:
    branches: [master]
    paths:
      - images/opengym/**
      - .github/workflows/opengym.yml
  pull_request:
    paths:
      - images/opengym/**
      - .github/workflows/opengym.yml
  workflow_dispatch:

permissions:
  contents: write   # write = push the opengym-<ver> tag after publishing

# One run at a time per ref: two pushes in quick succession would otherwise
# race the :latest tag and the source-tag step.
concurrency:
  group: opengym-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: 0x1917/opengym

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung buildx step otherwise burns the 6 h default; the whole job
    # (pull + build + smoke + push) runs in ~3 min when healthy.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and upstream ref from the Dockerfile
        id: meta
        run: |
          UP=$(grep -m1 '^ARG UPSTREAM_VERSION=' images/opengym/Dockerfile | cut -d= -f2)
          test -n "$UP"
          # Tag = the bare upstream release; the Dockerfile derives the same
          # value for the OCI version label.
          echo "version=$UP" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/duartesantos8/opengym-api:$UP" >> "$GITHUB_OUTPUT"
          # git-formatted (%cI) so the value is always well-formed — never
          # interpolate commit metadata into `with:` blocks directly.
          echo "build_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Only feeds the provenance label: the Dockerfile itself pins by tag.
      - name: Resolve base image digest
        id: digest
        run: echo "base_digest=$(docker buildx imagetools inspect ${{ steps.meta.outputs.api }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: "0x1917"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: images/opengym
          load: true
          tags: opengym:test
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=registry,ref=${{ env.IMAGE }}:latest
          # PRs have no Docker Hub credentials (the login step is skipped), so a
          # registry cache export fails 401. Use the Actions cache there.
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max' || format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            BASE_DIGEST=${{ steps.digest.outputs.base_digest }}

      - name: Smoke test
        run: bash images/opengym/scripts/smoke-test.sh opengym:test

      # Publish the image the smoke test just ran against: retag, then push.
      # There is no second build, so what ships cannot differ from what was
      # verified (same image ID, same layers).
      - name: Push the tested image (version + latest)
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag opengym:test "$IMAGE:$VERSION"
          docker tag opengym:test "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Verify both tags carry the same digest
        if: github.event_name != 'pull_request'
        run: |
          v=$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} --format '{{.Manifest.Digest}}')
          l=$(docker buildx imagetools inspect ${{ env.IMAGE }}:latest --format '{{.Manifest.Digest}}')
          echo "version: $v"; echo "latest:  $l"
          [ "$v" = "$l" ]

      # Tag the source state that published this version. The FIRST publish of a
      # release gets the bare tag (opengym-v1.4.3); a rebuild of the same release
      # gets the next number (opengym-v1.4.3-1, -2, …), so every publish leaves a
      # tag and none is ever moved. Re-running the same commit is a no-op: it
      # already carries one.
      - name: Tag the published source state
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          BASE="opengym-v${VERSION}"
          if git tag --points-at HEAD | grep -qF "$BASE"; then
            echo "this commit already carries a $BASE tag — nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="$BASE"
          NOTE="Source state published as $IMAGE:$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$BASE" >/dev/null 2>&1; then
            # The bare tag is taken: this is a rebuild. Number it — the series
            # restarts per release, and concurrency keeps two runs from racing.
            N=$(git ls-remote --tags origin | awk -v p="refs/tags/${BASE}-" \
                  'index($2, p) == 1 { n = substr($2, length(p) + 1); if (n ~ /^[0-9]+$/) print n }' \
                  | sort -n | tail -1)
            N=${N:-0}
            TAG="${BASE}-$((N + 1))"
            NOTE="Rebuild #$((N + 1)) of $IMAGE:$VERSION (release tag already exists)"
          fi
          git tag -a "$TAG" -m "$NOTE"
          git push origin "refs/tags/$TAG"
